[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "fox-autocomplete"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["protobuf>=5.29"]
[project.optional-dependencies]
test = ["pytest>=8"]
gcs = ["google-cloud-storage>=2"]
[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
exclude = ["src/autocomplete/autocomplete_snapshot_pb2.py", "src/autocomplete/autocomplete_snapshot_pb2.pyi"]

[tool.mypy]
python_version = "3.10"
strict = true
exclude = "autocomplete_snapshot_pb2.py"

[[tool.mypy.overrides]]
module = "autocomplete.autocomplete_snapshot_pb2"
ignore_errors = true

[project.scripts]
fox-build-snapshot = "autocomplete.build_snapshot:main"
