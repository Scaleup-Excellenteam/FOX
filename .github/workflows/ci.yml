name: CI

on:
  push:
  pull_request:

jobs:
  phase0:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install system Protobuf
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler libprotobuf-dev pkg-config

      - name: Verify frozen system toolchain
        run: |
          test "$(protoc --version)" = "libprotoc 3.21.12"
          test "$(pkg-config --modversion protobuf)" = "3.21.12"
          test "$(g++ -dumpfullversion)" = "13.3.0"
          test "$(cmake --version | head -n 1)" = "cmake version 3.28.3"
          protoc --version
          pkg-config --modversion protobuf
          g++ --version | head -n 1
          cmake --version | head -n 1

      - name: Install Python project
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run Python checks
        run: |
          source .venv/bin/activate
          python -m pytest
          python -m ruff check .
          python -m ruff format --check .

      - name: Configure, build, and test C++ foundation
        run: |
          cmake -S cpp -B build/cpp
          cmake --build build/cpp
          ctest --test-dir build/cpp --output-on-failure

      - name: Regenerate and verify Protobuf bindings
        run: |
          cp src/autocomplete/generated/autocomplete_snapshot_pb2.py \
            /tmp/autocomplete_snapshot_pb2.py.committed
          scripts/generate_proto.sh
          diff --exit-code \
            /tmp/autocomplete_snapshot_pb2.py.committed \
            src/autocomplete/generated/autocomplete_snapshot_pb2.py
          source .venv/bin/activate
          python -c "from autocomplete.generated import autocomplete_snapshot_pb2"
